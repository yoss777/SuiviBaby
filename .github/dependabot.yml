version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Versions tied to the Expo SDK: updated together with `npx expo install --fix`
    # on SDK upgrades, never one by one (a lone bump breaks the native build).
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native-firebase/*"
      - dependency-name: "@sentry/react-native"
      # Liés au SDK Expo / Reanimated (PR #34, #36 fermées le 2026-11-07) :
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "@gorhom/bottom-sheet"
      - dependency-name: "@react-native-picker/picker"
      - dependency-name: "@react-native-async-storage/async-storage"
      # Outillage aligné sur le SDK Expo (montée 58, 2026-11-08) :
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "@react-native/*"
      - dependency-name: "typescript"
      - dependency-name: "react-test-renderer"
      # Testing Library 14 : API asynchrone, migration des tests à part.
      - dependency-name: "@testing-library/react-native"
        update-types: ["version-update:semver-major"]
      # SDK Firebase web : ses versions tirent des modules natifs
      # (AsyncStorage 3.x, PR #44) → lot dédié avec tests sur appareil.
      - dependency-name: "firebase"
      - dependency-name: "@react-native-google-signin/*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Majeures du socle serveur : lot « socle serveur » testé (#31–#33).
    ignore:
      - dependency-name: "firebase-functions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-server-sdk"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
