name: EAS Preview

# Manual only (Actions → EAS Preview → Run workflow). It used to run on every
# pull request, but iOS internal builds need an ad hoc profile that was never
# set up, so every run failed while still queueing an EAS Android build that
# nobody installed; testing goes through TestFlight and the Play Alpha track.
on:
  workflow_dispatch:

jobs:
  preview:
    name: Build Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build preview
        run: eas build --profile preview --platform all --non-interactive --no-wait
