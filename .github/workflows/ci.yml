name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint (errors fail CI; warnings are reported)
        run: npm run lint

      - name: ESLint Cloud Functions (errors fail CI)
        run: npx eslint functions --quiet

      # Reports "app config fields not synced" (native folders + app.config.js).
      # Non-blocking until that check is resolved; make it blocking afterwards.
      - name: Expo Doctor
        continue-on-error: true
        run: npx expo-doctor

      - name: Run app tests
        run: npm test -- --ci --coverage

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Run CF tests (coverage thresholds in functions/jest.config.js)
        run: npm run test:functions -- --ci --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            functions/coverage/
          retention-days: 7

  rules-test:
    name: Security rules tests (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Every *.rules.test.ts suite (firestore, storage, multiUser), see
      # jest.config.rules.js. The demo- project id needs no credentials; the
      # suites read the project from GCLOUD_PROJECT (set by emulators:exec).
      - name: Run Firestore and Storage rules tests
        run: >-
          npx -y firebase-tools@15 emulators:exec --only firestore,storage
          --project demo-samaye 'npm run test:rules:run'
