name: iOS build (GitHub macOS runner)

# iOS store build without the EAS cloud quota (2026-11-08: monthly EAS build
# limit reached; this Mac is on macOS 13 / Xcode 15.2, too old for React
# Native). Same command as a local build (`eas build --local`) but on a GitHub
# macOS runner (macos-26) with a recent Xcode, then `eas submit` to App Store Connect
# (EAS Submit is not counted in the build quota). Manual only.
#
# - Signing: EAS remote credentials (distribution certificate + provisioning
#   profile), read with EXPO_TOKEN. Build numbers: EAS remote counter
#   (appVersionSource: remote), incremented by the build like on EAS cloud.
# - Firebase iOS file: EAS "secret" file variables are not readable outside EAS
#   servers, so the plist comes from the GitHub secret
#   GOOGLE_SERVICE_INFO_PLIST_B64 (base64 of GoogleService-Info.plist) and is
#   written where both layouts expect it (committed ios/ folder before CNG,
#   project root with CNG, docs/adr/0004).
# - Sentry source maps: uploaded when the SENTRY_AUTH_TOKEN secret is set,
#   skipped otherwise (the build still succeeds).
#
# Required secrets: EXPO_TOKEN, GOOGLE_SERVICE_INFO_PLIST_B64;
# optional: SENTRY_AUTH_TOKEN.
#
# Cost: macOS minutes count 10x on a private repository (about 25-35 min per
# build). Release to the public App Store stays a manual decision in App Store
# Connect: this only uploads to TestFlight.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to build (e.g. release/1.0.13)"
        required: true
        default: main
      submit:
        description: "Send the build to App Store Connect (TestFlight) after the build"
        required: true
        default: true
        type: boolean
      profile:
        description: "EAS profile: production (TestFlight) or development (dev client to install on a registered iPhone, never submitted)"
        required: true
        default: production
        type: choice
        options:
          - production
          - development
      show_previews:
        description: "INTERNAL ONLY: show preview screens (SHOW_PREVIEWS=true). Never submit such a build for App Store review."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-local-build
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS (${{ inputs.profile }}) and submit
    # Expo 58 needs Xcode 26.4+: macos-15 tops out at Xcode 26.3.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SHOW_PREVIEWS: ${{ inputs.show_previews && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check required secrets
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          for v in EXPO_TOKEN PLIST_B64; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret ${v/PLIST_B64/GOOGLE_SERVICE_INFO_PLIST_B64}"; exit 1; fi
          done
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::notice::SENTRY_AUTH_TOKEN not set: Sentry source maps are not uploaded."
            echo "SENTRY_DISABLE_AUTO_UPLOAD=true" >> "$GITHUB_ENV"
          fi

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Firebase iOS file
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          echo "$PLIST_B64" | base64 --decode > GoogleService-Info.plist
          if [ -d ios/SuiviBaby ]; then cp GoogleService-Info.plist ios/SuiviBaby/GoogleService-Info.plist; fi
          grep -q "<key>PROJECT_ID</key>" GoogleService-Info.plist || { echo "::error::Invalid plist"; exit 1; }

      - name: Preview screens warning
        if: ${{ inputs.show_previews }}
        run: echo "::warning::INTERNAL build with preview screens (SHOW_PREVIEWS=true). TestFlight internal testing only, never submit it for App Store review."

      - name: Preflight native App Check
        # Avant le build : aucun numéro consommé si Firebase natif n'est pas câblé.
        if: ${{ inputs.profile == 'production' }}
        env:
          EAS_BUILD: "true"
          EAS_BUILD_PLATFORM: ios
          CI: "1"
        run: |
          CHECK_DIR="$RUNNER_TEMP/prebuild-check"
          rm -rf "$CHECK_DIR"
          mkdir -p "$CHECK_DIR"
          rsync -a --exclude node_modules --exclude .git --exclude /ios --exclude /android ./ "$CHECK_DIR/"
          ln -s "$PWD/node_modules" "$CHECK_DIR/node_modules"
          if ! (cd "$CHECK_DIR" && npx expo prebuild --platform ios --no-install > prebuild.log 2>&1); then
            echo "::error::iOS prebuild failed"
            tail -30 "$CHECK_DIR/prebuild.log"
            exit 1
          fi
          DELEGATE=$(find "$CHECK_DIR/ios" -name AppDelegate.swift | head -1)
          FACTORY_LINE=$(grep -n '^[[:space:]]*RNFBAppCheckModule.sharedInstance()' "$DELEGATE" | head -1 | cut -d: -f1)
          CONFIGURE_LINE=$(grep -n '^[[:space:]]*FirebaseApp.configure()' "$DELEGATE" | head -1 | cut -d: -f1)
          rm -rf "$CHECK_DIR"
          if [ -z "$FACTORY_LINE" ] || [ -z "$CONFIGURE_LINE" ] || [ "$FACTORY_LINE" -ge "$CONFIGURE_LINE" ]; then
            echo "::error::App Check factory must be registered before FirebaseApp.configure()"
            exit 1
          fi
          echo "Native App Check wired in AppDelegate"

      - name: Build (eas build --local)
        # Dossier de travail sans lien symbolique : sous $TMPDIR (/var → /private/var),
        # le plugin expo-widgets écrit le chemin du layout en /var/… et Metro, qui
        # résout en /private/var/…, ne trouve plus widgets/BebeMaintenant.ios.tsx.
        env:
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-build
          # Toutes les phases (prebuild, Xcode) doivent voir la plateforme.
          EAS_BUILD_PLATFORM: ios
        run: |
          # eas-cli épinglé (pas @latest) : il tourne avec EXPO_TOKEN et SENTRY_AUTH_TOKEN ;
          # une version compromise ou cassée ne doit pas entrer sans revue.
          npx --yes eas-cli@27.10.0 build --local --platform ios --profile "${{ inputs.profile }}" \
            --non-interactive --output "$RUNNER_TEMP/app.ipa"
          ls -l "$RUNNER_TEMP/app.ipa"

      - name: Verify App Check in the signed app
        # Sans droit, sans fichier Firebase ou sans drapeau, App Check échoue sur
        # tous les iPhone, sans erreur visible.
        if: ${{ inputs.profile == 'production' }}
        run: |
          CHECK_DIR="$RUNNER_TEMP/ipa-check"
          mkdir -p "$CHECK_DIR"
          unzip -q "$RUNNER_TEMP/app.ipa" -d "$CHECK_DIR"
          APP=$(ls -d "$CHECK_DIR"/Payload/*.app | head -1)
          KEY=com.apple.developer.devicecheck.appattest-environment
          if ! codesign -d --entitlements :- "$APP" > "$CHECK_DIR/entitlements.plist" 2> "$CHECK_DIR/codesign.err"; then
            echo "::error::Cannot read the entitlements of the signed app"
            cat "$CHECK_DIR/codesign.err"
            exit 1
          fi
          APP_VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$CHECK_DIR/entitlements.plist" 2>/dev/null || true)
          FIREBASE_PLIST=no
          [ -f "$APP/GoogleService-Info.plist" ] && FIREBASE_PLIST=yes
          APP_CONFIG=$(find "$APP" -path '*EXConstants.bundle/app.config' -type f | head -1)
          if [ -z "$APP_CONFIG" ]; then
            rm -rf "$CHECK_DIR"
            echo "::error::Embedded app config not found in the signed app"
            exit 1
          fi
          NATIVE_FLAG=$(node -e 'const c=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.stdout.write(String(c.extra?.appCheck?.nativeConfiguredIos===true))' "$APP_CONFIG" 2>/dev/null || echo false)
          rm -rf "$CHECK_DIR"
          if [ "$APP_VALUE" != "production" ]; then
            echo "::error::App Attest entitlement missing from the signed app"
            exit 1
          fi
          if [ "$FIREBASE_PLIST" != "yes" ]; then
            echo "::error::GoogleService-Info.plist missing from the signed app"
            exit 1
          fi
          if [ "$NATIVE_FLAG" != "true" ]; then
            echo "::error::Native App Check is not enabled in the embedded app config"
            exit 1
          fi
          echo "App Check: entitlement, Firebase file and native flag present"

      - name: Submit to App Store Connect
        # A development client is never sent to App Store Connect.
        if: ${{ inputs.submit && inputs.profile == 'production' }}
        run: |
          npx --yes eas-cli@27.10.0 submit --platform ios --profile production \
            --path "$RUNNER_TEMP/app.ipa" --non-interactive

      - name: Keep the .ipa (7 days)
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/app.ipa
          retention-days: 7
          if-no-files-found: ignore
