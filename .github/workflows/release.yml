name: Release

# Rewritten in audit S12.3. Manual only (Actions → Release → Run workflow).
#
# What changed from the old file and why:
# - the build is awaited (`eas build --wait --json`) and its id read from the
#   output, so the submit step sends exactly that build (`eas submit --id`),
#   never `--latest` (which used to pick the previous build);
# - Android builds on EAS cloud again: the Firebase file comes from the EAS file
#   variable GOOGLE_SERVICES_JSON, copied by scripts/easCopyFirebaseFiles.js
#   (docs/adr/0001-android-cloud-build.md);
# - Android submit goes to the Play "alpha" track only (Q9) with the service
#   account key from the GOOGLE_PLAY_SERVICE_ACCOUNT_KEY secret;
# - app_config/latest_version (in-app update banner) is only written after a
#   human confirms the version is LIVE in the store(s), through the
#   "store-release" environment approval — never at submit time;
# - Cloud Functions are no longer deployed here (deploy-functions.yml owns it).
#
# Required configuration (not created by this file, see docs/ENVIRONMENTS.md):
#   secrets: EXPO_TOKEN, GOOGLE_PLAY_SERVICE_ACCOUNT_KEY (Android submit),
#            GCP_SA_KEY (app_config write, production)
#   environments: store-release (required reviewers: Yoss)
#   EAS: file variable GOOGLE_SERVICES_JSON (production + preview environments),
#        remote build numbers initialised (eas build:version:set)
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        default: ios
        type: choice
        options:
          - ios
          - android
      profile:
        description: "EAS build profile (production = store build + submit; staging = internal build, no submit)"
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: release-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run app tests
        run: npm test -- --ci

      - name: Install function dependencies
        run: cd functions && npm ci

      - name: Run CF tests
        run: npm run test:functions -- --ci

  build:
    name: EAS build (${{ inputs.platform }}, ${{ inputs.profile }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      build_id: ${{ steps.build.outputs.build_id }}
      app_version: ${{ steps.build.outputs.app_version }}
      build_version: ${{ steps.build.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Build and wait
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          # --wait (default) blocks until the build finishes; --json prints the
          # finished build(s) on stdout, logs go to stderr.
          eas build --platform "$PLATFORM" --profile "$PROFILE" \
            --non-interactive --wait --json > "$RUNNER_TEMP/build.json"
          STATUS=$(jq -r '.[0].status' "$RUNNER_TEMP/build.json")
          BUILD_ID=$(jq -r '.[0].id' "$RUNNER_TEMP/build.json")
          if [ "$STATUS" != "FINISHED" ] || [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "::error::EAS build $BUILD_ID ended with status $STATUS"
            exit 1
          fi
          {
            echo "build_id=$BUILD_ID"
            echo "app_version=$(jq -r '.[0].appVersion' "$RUNNER_TEMP/build.json")"
            echo "build_version=$(jq -r '.[0].appBuildVersion' "$RUNNER_TEMP/build.json")"
          } >> "$GITHUB_OUTPUT"
          echo "Build $BUILD_ID finished: https://expo.dev/accounts/yoss7/projects/suivibaby/builds/$BUILD_ID" >> "$GITHUB_STEP_SUMMARY"

  submit:
    name: Submit build ${{ needs.build.outputs.build_version }} (${{ inputs.platform }})
    needs: build
    if: inputs.profile == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # eas.json submit.production.android.serviceAccountKeyPath points here.
      - name: Write Google Play service account key
        if: inputs.platform == 'android'
        env:
          PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$PLAY_KEY" ]; then
            echo "::error::Secret GOOGLE_PLAY_SERVICE_ACCOUNT_KEY is missing (docs/ENVIRONMENTS.md)."
            exit 1
          fi
          mkdir -p secrets
          printf '%s' "$PLAY_KEY" > secrets/google-play-service-account.raw
          if head -c 1 secrets/google-play-service-account.raw | grep -q '{'; then
            mv secrets/google-play-service-account.raw secrets/google-play-service-account.json
          else
            base64 -d secrets/google-play-service-account.raw > secrets/google-play-service-account.json
            rm secrets/google-play-service-account.raw
          fi

      # Exactly the build produced above. iOS: App Store Connect / TestFlight
      # (public release stays Yoss's decision). Android: Play "alpha" track.
      - name: Submit
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: >
          eas submit --platform "$PLATFORM" --profile production
          --id "$BUILD_ID" --non-interactive --wait

      - name: Remove Google Play service account key
        if: always()
        run: rm -rf secrets

  publish-app-config:
    name: Update app_config (after store release)
    needs: [build, submit]
    if: inputs.profile == 'production'
    runs-on: ubuntu-latest
    # Required reviewers on this environment: approve ONLY once version
    # ${{ needs.build.outputs.app_version }} is publicly available on BOTH the
    # App Store and Google Play production. latest_version is shared by both
    # platforms, so approving earlier shows the update banner to users who
    # cannot install the update yet. Pending approvals expire after 30 days;
    # `npm run update-app-config` remains the manual fallback.
    environment: store-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check app.json matches the submitted build
        env:
          BUILT_VERSION: ${{ needs.build.outputs.app_version }}
        run: |
          APP_JSON_VERSION=$(jq -r '.expo.version' app.json)
          if [ "$APP_JSON_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::app.json version $APP_JSON_VERSION differs from the built version $BUILT_VERSION"
            exit 1
          fi

      # The script has no dependency (Node fetch + crypto), no npm ci needed.
      # MIN_VERSION is not set: the script keeps the current minVersion.
      - name: Update Firestore app_config/latest_version
        run: node ./scripts/updateAppConfig.mjs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          RELEASE_NOTES: Version ${{ needs.build.outputs.app_version }}
