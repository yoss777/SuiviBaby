# 04 — Voice bar UI flow
# Validates: voice bar visible above the tab bar, tap-to-toggle recording,
# microphone permission dialog and recording state.
# Note: actual speech cannot be simulated in Maestro; this flow only checks the UI.
# Prerequisite: user logged in (owner/admin of the active child) and on home screen
appId: com.tesfa.suivibaby

---

- launchApp

# Attendre le dashboard
- extendedWaitUntil:
    visible: "Accueil"
    timeout: 15000

# La barre micro est visible au repos
- assertVisible:
    id: "voice-bar"
- assertVisible: "Maintenez pour parler"

# Appui court : démarre l'enregistrement mains libres
- tapOn:
    id: "voice-bar"

# Soit la permission micro est demandée, soit l'enregistrement démarre
- extendedWaitUntil:
    visible:
      anyOf:
        - "Autoriser"
        - "Permission requise"
        - "Touchez pour envoyer"
    timeout: 5000

# Si l'enregistrement a démarré, un second appui l'envoie
- runFlow:
    when:
      visible: "Touchez pour envoyer"
    commands:
      - tapOn:
          id: "voice-bar"
